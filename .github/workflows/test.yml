name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate:openapi
      - run: npm run test:unit

  test-integration-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `/public/*` endpoints aggregate across all orgs and can't be made
          # immune to other files inserting rows in parallel — keep stats alone.
          - name: stats
            files: tests/integration/stats.test.ts
          # Heaviest file by test count and wall-clock; runs alone.
          - name: runs
            files: tests/integration/runs.test.ts
          - name: writers
            files: tests/integration/batch-costs.test.ts tests/integration/events.test.ts tests/integration/transfer-brand.test.ts tests/integration/delete-runs-by-org.test.ts tests/integration/platform-runs.test.ts tests/integration/runs-batch.test.ts
          - name: misc
            files: tests/integration/runs-expected-totals.test.ts tests/integration/health.test.ts tests/integration/indexes.test.ts tests/integration/openapi.test.ts tests/integration/bsg-substrate.test.ts tests/integration/bsg-phase2-5.test.ts tests/integration/cost-aggregator-parity.test.ts tests/integration/persona-attribution.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}-${{ matrix.name }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Set database URL
        run: echo "DB_URL=${{ steps.neon.outputs.db_url }}" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npx drizzle-kit migrate
        env:
          RUNS_SERVICE_DATABASE_URL: ${{ env.DB_URL }}

      - name: Generate OpenAPI spec
        run: npm run generate:openapi

      - name: Run integration tests
        run: npx vitest run ${{ matrix.files }}
        env:
          RUNS_SERVICE_DATABASE_URL: ${{ env.DB_URL }}
          RUNS_SERVICE_API_KEY: test-api-key
          COSTS_SERVICE_URL: https://costs.mcpfactory.org
          COSTS_SERVICE_API_KEY: ${{ secrets.COSTS_SERVICE_API_KEY }}

      - name: Cleanup Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}-${{ matrix.name }}
          api_key: ${{ secrets.NEON_API_KEY }}

  # Aggregator with the literal name `test-integration` so branch protection
  # (which requires a single status check by that name) is satisfied. Fails
  # if any shard failed.
  test-integration:
    runs-on: ubuntu-latest
    needs: test-integration-shard
    if: always()
    steps:
      - name: Verify all shards passed
        run: |
          if [ "${{ needs.test-integration-shard.result }}" != "success" ]; then
            echo "One or more test-integration shards failed: ${{ needs.test-integration-shard.result }}"
            exit 1
          fi
