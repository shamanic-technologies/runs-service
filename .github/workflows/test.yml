name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate:openapi
      - run: npm run test:unit

  test-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}-shard-${{ matrix.shard }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Set database URL
        run: echo "DB_URL=${{ steps.neon.outputs.db_url }}" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npx drizzle-kit migrate
        env:
          RUNS_SERVICE_DATABASE_URL: ${{ env.DB_URL }}

      - name: Generate OpenAPI spec
        run: npm run generate:openapi

      - name: Run integration tests
        run: npx vitest run tests/integration --shard=${{ matrix.shard }}/4
        env:
          RUNS_SERVICE_DATABASE_URL: ${{ env.DB_URL }}
          RUNS_SERVICE_API_KEY: test-api-key
          COSTS_SERVICE_URL: https://costs.mcpfactory.org
          COSTS_SERVICE_API_KEY: ${{ secrets.COSTS_SERVICE_API_KEY }}

      - name: Cleanup Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}-shard-${{ matrix.shard }}
          api_key: ${{ secrets.NEON_API_KEY }}
